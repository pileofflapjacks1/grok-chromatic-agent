name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scaffolder help / basic invocation check
        run: |
          python scripts/generate_basic_project.py --help || true
          python scripts/audit_checklist.py
          python scripts/chromatic_helpers.py backup-reminder

      - name: Validate skill frontmatter
        run: |
          head -n 10 SKILL.md
          grep -q "name: grok-chromatic-agent" SKILL.md
          grep -q "type: workflow" SKILL.md
          echo "Skill frontmatter looks valid"
